# goreleaser config for Hasfy-Relay
# Builds the cross-platform agent (and the relay binary, x86_64 linux for Docker).
# Run via GitHub Actions on tag push v*.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: agent
    binary: hasfy-agent
    main: ./cmd/agent
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: relay
    binary: relay
    main: ./cmd/relay
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos: [linux]
    goarch: [amd64, arm64]

archives:
  - id: agent-archives
    ids: [agent]
    name_template: "hasfy-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README.md

# nfpm: native .deb / .rpm so the package manager is the single privileged step.
#
# Before this, a Linux install ran the Tauri installer, which shelled out to
# `pkexec`/`sudo` separately for the Elastic Agent, for registering the relay
# service, and again on every daemon self-update. The package manager already
# authenticates once and runs as root; the daemon it installs enrols itself.
nfpms:
  - id: agent-packages
    ids: [agent]
    package_name: hasfy-agent
    vendor: Hasfy
    homepage: https://hasfy.fr
    maintainer: Hasfy <support@hasfy.fr>
    description: |-
      Hasfy endpoint agent.
      Enrols itself on first start via the Hasfy device authorization flow;
      no token to copy and no elevation prompt after installation.
    license: Proprietary
    formats: [deb, rpm]
    bindir: /opt/hasfy
    contents:
      - src: packaging/linux/hasfy-agent.service
        dst: /lib/systemd/system/hasfy-agent.service
      # Config lives outside the package payload: the daemon writes agent.env
      # itself during enrolment, and declaring it here would make the package
      # manager fight those writes on every upgrade.
      - dst: /etc/hasfy
        type: dir
        file_info:
          mode: 0750
    scripts:
      postinstall: packaging/linux/postinstall.sh
      preremove: packaging/linux/preremove.sh
      postremove: packaging/linux/postremove.sh
    rpm:
      signature:
        key_file: "{{ .Env.LINUX_GPG_KEY_PATH }}"
    deb:
      signature:
        key_file: "{{ .Env.LINUX_GPG_KEY_PATH }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: HasfyFR
    name: Hasfy-Relay
  prerelease: auto
  draft: false
