name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────
  # Windows MSI — the counterpart of the .deb/.rpm goreleaser builds
  # above and of Hasfy-Agent's .pkg. Needs a Windows runner for the WiX
  # toolset, so it cannot ride along in the goreleaser job.
  #
  # Registers the daemon as a Windows service, which is what makes the
  # OS package the single privileged step on Windows too. Before this,
  # the GUI installer elevated separately for each step and parked the
  # daemon behind a scheduled task.
  # ──────────────────────────────────────────────────────────────────
  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }

      - name: Compute version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build the daemon
        shell: bash
        env:
          VERSION: v${{ steps.ver.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.Version=${VERSION}" \
            -o dist/hasfy-agent.exe ./cmd/agent

      - name: Add the WiX toolset to PATH
        shell: pwsh
        run: |
          # Shipped with the GitHub Windows image; adding the directory is
          # cheaper and more predictable than installing it per run.
          $wix = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path $wix)) { $wix = "$env:WIX\bin" }
          if (-not (Test-Path $wix)) { throw "WiX toolset not found on the runner" }
          Add-Content -Path $env:GITHUB_PATH -Value $wix

      - name: Build the MSI
        shell: pwsh
        run: |
          ./packaging/windows/build-msi.ps1 `
            -Version "${{ steps.ver.outputs.version }}" `
            -Binary  "dist/hasfy-agent.exe" `
            -OutDir  "dist"

      - name: Sign the MSI
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if (-not $env:AZURE_CLIENT_ID) {
            # Unsigned is a real cost on Windows — SmartScreen will warn — but
            # failing the release would leave no artefact at all. Loud, not fatal.
            Write-Warning "Azure code-signing is not configured; the MSI is unsigned."
            exit 0
          }
          Write-Host "Signing is configured; wire the Trusted Signing step here."

      - uses: actions/upload-artifact@v4
        with:
          name: hasfy-agent-msi
          path: dist/*.msi
          if-no-files-found: error

  docker-relay:
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/hasfyfr/hasfy-relay:${{ steps.ver.outputs.version }}
            ghcr.io/hasfyfr/hasfy-relay:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────
  # Publish the daemon binary + manifest JSON to Supabase Storage so
  # the Hasfy-Installer's daemon updater can pick it up. The manifest
  # is at installers/agent-daemon-manifest.json and is overwritten
  # atomically on every tag push.
  # ──────────────────────────────────────────────────────────────────
  publish-daemon-manifest:
    runs-on: ubuntu-latest
    needs: goreleaser
    env:
      SUPABASE_URL: https://supabase.hasfy.fr
      BUCKET: installers
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Bail out if SUPABASE_SERVICE_ROLE_KEY is not configured
        env:
          SVC_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SVC_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY not set — skipping daemon publish"
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-go@v5
        if: env.skip != 'true'
        with: { go-version: "1.24" }

      - name: Compute version
        if: env.skip != 'true'
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Cross-build daemon binaries
        if: env.skip != 'true'
        env:
          VERSION: v${{ steps.ver.outputs.version }}
        run: |
          set -eu
          mkdir -p dist-daemon
          LDFLAGS="-s -w -X main.Version=${VERSION}"
          for plat in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${plat%/*}"; arch="${plat#*/}"
            out="dist-daemon/hasfy-agent-${VERSION}-${os}-${arch}"
            [ "$os" = "windows" ] && out="${out}.exe"
            echo "Building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$LDFLAGS" -o "$out" ./cmd/agent
          done
          ls -la dist-daemon/

      - name: Upload daemon binaries + manifest to Supabase
        if: env.skip != 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ steps.ver.outputs.version }}
          # Same minisign key the Hasfy-Agent release pipeline uses. The
          # installer has the matching public key compiled in as
          # HASFY_UPDATER_PUBKEY and refuses to apply a daemon update whose
          # manifest is unsigned or badly signed.
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_KEY_PASSWORD: ${{ secrets.MINISIGN_KEY_PASSWORD }}
        run: |
          set -eu

          # The manifest is the root of trust for the daemon self-updater: it
          # names the artifact URL and its sha256, and the binary it points at
          # runs as root with a remote PTY behind it. The per-artifact sha256
          # lives *inside* the manifest, so it authenticates nothing on its
          # own — without a detached signature, write access to this public
          # bucket is root on the whole fleet. Refuse to publish unsigned.
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set in this repository."
            echo
            echo "The daemon manifest is the root of trust for hasfy-agent self-update:"
            echo "it names the binary URL and its sha256, and that binary runs as root"
            echo "with a remote PTY behind it. The sha256 lives *inside* the manifest, so"
            echo "it authenticates nothing on its own — write access to the public bucket"
            echo "would be root on the whole fleet."
            echo
            echo "Hasfy-Agent/src-tauri/src/updater/daemon.rs verifies a detached minisign"
            echo "signature and refuses an unsigned manifest, so publishing without one"
            echo "would not be insecure — it would simply disable daemon auto-update."
            echo
            echo "Fix: copy the two secrets that already exist in the Hasfy-Agent repo:"
            echo "  gh secret set MINISIGN_SECRET_KEY   --repo HasfyFR/Hasfy-Relay"
            echo "  gh secret set MINISIGN_KEY_PASSWORD --repo HasfyFR/Hasfy-Relay"
            echo "They must be the same key pair whose public half is baked into the"
            echo "installer as HASFY_UPDATER_PUBKEY, or clients will reject the signature."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign

          upload() {
            local file="$1" remote="$2" mime="$3"
            local code
            code=$(curl -s -o /tmp/_body -w "%{http_code}" \
              -X POST "${SUPABASE_URL}/storage/v1/object/${BUCKET}/${remote}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: ${mime}" \
              -H "x-upsert: true" \
              --data-binary "@${file}" \
              --max-time 300)
            case "$code" in
              200|201) echo "  ✓ ${remote}" ;;
              *)       echo "  ✗ ${remote} (HTTP $code)"; cat /tmp/_body; exit 1 ;;
            esac
          }

          # Build the manifest JSON in parallel with the uploads so we
          # only commit the manifest after every binary is in place.
          # Otherwise a partial upload would point clients at 404s.
          artifacts_json="["
          first=1
          for plat in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${plat%/*}"; arch="${plat#*/}"
            src="dist-daemon/hasfy-agent-${VERSION}-${os}-${arch}"
            remote="hasfy-agent-${VERSION}-${os}-${arch}"
            mime="application/octet-stream"
            if [ "$os" = "windows" ]; then
              src="${src}.exe"
              remote="${remote}.exe"
              mime="application/x-msdownload"
            fi
            [ -f "$src" ] || { echo "missing $src"; exit 1; }

            sha=$(sha256sum "$src" | cut -d' ' -f1)
            size=$(stat -c%s "$src")
            url="${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${remote}"

            echo "Uploading $remote (${size} bytes, sha256=${sha:0:12}…)"
            upload "$src" "$remote" "$mime"

            [ $first -eq 0 ] && artifacts_json="${artifacts_json},"
            first=0
            artifacts_json="${artifacts_json}{\"platform\":\"${os}\",\"arch\":\"${arch}\",\"url\":\"${url}\",\"sha256\":\"${sha}\",\"size\":${size}}"
          done
          artifacts_json="${artifacts_json}]"

          cat > /tmp/agent-daemon-manifest.json <<EOF
          {
            "latest": "${VERSION}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "artifacts": ${artifacts_json}
          }
          EOF
          echo "Manifest:"; cat /tmp/agent-daemon-manifest.json

          # Sign the manifest bytes exactly as they will be served. The
          # client verifies the raw response before parsing it, so any
          # re-formatting between here and upload would break verification.
          KEY_FILE=$(mktemp /tmp/minisign.key.XXXXXX)
          trap 'rm -f "$KEY_FILE"' EXIT
          echo "$MINISIGN_SECRET_KEY" | base64 -d > "$KEY_FILE"
          if [ -n "${MINISIGN_KEY_PASSWORD:-}" ]; then
            echo "$MINISIGN_KEY_PASSWORD" | minisign -S -H -s "$KEY_FILE" \
              -m /tmp/agent-daemon-manifest.json \
              -x /tmp/agent-daemon-manifest.json.minisig >/dev/null
          else
            minisign -S -H -s "$KEY_FILE" \
              -m /tmp/agent-daemon-manifest.json \
              -x /tmp/agent-daemon-manifest.json.minisig </dev/null >/dev/null
          fi

          # Signature first, manifest last, so the new manifest is never
          # served without a matching signature already in place. The
          # remaining race — a client reading the old manifest and the new
          # signature — fails verification, which is fail-closed: the daemon
          # keeps its current version and retries at the next 6 h tick.
          upload /tmp/agent-daemon-manifest.json.minisig \
            "agent-daemon-manifest.json.minisig" "text/plain"
          upload /tmp/agent-daemon-manifest.json "agent-daemon-manifest.json" "application/json"

          # ── Paquets Linux, pour le téléchargement depuis Hasfy-App ──
          #
          # Linux n'a plus de GUI Tauri : la console propose directement le
          # paquet du daemon, donc il doit exister dans ce bucket.
          #
          # Récupérés depuis la release GitHub et non depuis dist/ : goreleaser
          # tourne dans un autre job, donc sur un autre runner — dist/ est vide
          # ici, et la boucle ne trouvait rien sans rien signaler.
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.deb' --pattern '*.rpm' \
            --dir dist --clobber

          for pkg in dist/*.deb dist/*.rpm; do
            [ -f "$pkg" ] || continue
            case "$pkg" in
              *amd64.deb|*x86_64.deb) remote="hasfy-agent-${VERSION}-linux-amd64.deb"; mime="application/vnd.debian.binary-package" ;;
              *arm64.deb|*aarch64.deb) remote="hasfy-agent-${VERSION}-linux-arm64.deb"; mime="application/vnd.debian.binary-package" ;;
              *x86_64.rpm)             remote="hasfy-agent-${VERSION}-linux-amd64.rpm"; mime="application/x-rpm" ;;
              *aarch64.rpm)            remote="hasfy-agent-${VERSION}-linux-arm64.rpm"; mime="application/x-rpm" ;;
              *) echo "  ↷ $pkg : nom inattendu, ignoré"; continue ;;
            esac
            echo "Uploading $remote"
            upload "$pkg" "$remote" "$mime"
          done
          echo "Daemon manifest published and signed for ${VERSION}"
